# Standalone copy for kbansal1512/chia-hackathon (repo root = this tree).
name: Regression

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BOOM_SKIP_LSU_COV: "1"
  BOOM_BUILD_LSU_COV: "0"

jobs:
  unit:
    name: Unit tests (no MediumBOOM, no SymbiYosys)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run coverage-growth tests
        run: python -m pytest tests -q --tb=short

  fake-experiment:
    name: Fake-backend experiment + charts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Oracle catalog + fake curve
        run: |
          python run_experiment.py \
            --backend fake \
            --oracles all \
            --budget-hours 8 \
            --seeds 1,2 \
            --out artifacts_ci_fake
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path("artifacts_ci_fake")
          results = json.loads((out / "results.json").read_text())
          compare = json.loads((out / "compare.json").read_text())
          catalog = json.loads((out / "oracle_catalog.json").read_text())
          assert catalog["catalog_id"] == "oracles-20260907"
          arms = {"baseline", "sva_first", "sim_max", "cph_greedy", "stage_clean", "enh_v1"}
          assert arms <= set(compare["mean_final_hit"])
          assert arms <= set(compare["mean_final_closure"])
          assert (out / "enhancement.json").exists()
          enh = json.loads((out / "enhancement.json").read_text())
          assert enh["id"] == "enh-20260909"
          assert catalog["catalog_id"] == "oracles-20260907"
          for name in (
              "coverage_vs_hours.svg",
              "final_coverage_bars.svg",
              "hours_to_90pct.svg",
              "engine_mix.svg",
          ):
              assert (out / name).exists(), name
          print("ok", results.get("mean_final_closure"))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chia-fake-experiment
          path: artifacts_ci_fake
          retention-days: 14
